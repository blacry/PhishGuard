services:
  phishguard:
    build: .
    image: phishguard:local
    stdin_open: true
    tty: true
    environment:
      PHISHGUARD_ENABLE_OPENPHISH: ${PHISHGUARD_ENABLE_OPENPHISH:-0}
      PHISHGUARD_ENCRYPTION_KEY: ${PHISHGUARD_ENCRYPTION_KEY:-}
      PHISHGUARD_RETENTION_DAYS: ${PHISHGUARD_RETENTION_DAYS:-90}
    volumes:
      - phishguard-data:/app/data
      - phishguard-visualizations:/app/visualizations

volumes:
  phishguard-data:
  phishguard-visualizations:
